<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shikoku road trip · Oct 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8F7; --card:#FFFFFF; --ink:#16262D; --muted:#5D6F76; --line:#D7E0E2;
  --ai:#0E4C63; --niyodo:#1E9FB0; --niyodo-soft:#DDF1F3; --yuzu:#C98A00; --yuzu-soft:#FBF1D6;
  --drive:#8A9AA0; --ok:#2E7D4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A1F; --card:#16252C; --ink:#E6EEF0; --muted:#98ABB1; --line:#283B43;
    --ai:#7CC3D6; --niyodo:#3FC2D2; --niyodo-soft:#173A42; --yuzu:#F0C24A; --yuzu-soft:#3A3219;
    --drive:#6F848B; --ok:#6CC592;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A1F; --card:#16252C; --ink:#E6EEF0; --muted:#98ABB1; --line:#283B43;
  --ai:#7CC3D6; --niyodo:#3FC2D2; --niyodo-soft:#173A42; --yuzu:#F0C24A; --yuzu-soft:#3A3219;
  --drive:#6F848B; --ok:#6CC592;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 96px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-weight:900;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.05;margin:0;letter-spacing:-0.01em;color:var(--ai)}
h1 small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.countdown{font-weight:700;color:var(--ink);background:var(--niyodo-soft);border-radius:999px;padding:6px 14px;font-size:.92rem}

/* Tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  display:flex;gap:4px;padding:8px 0;margin:0 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;
  padding:8px 12px;border-radius:10px;cursor:pointer;font-size:.95rem}
nav.tabs button[aria-selected="true"]{background:var(--ai);color:var(--paper)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--niyodo);outline-offset:2px}

/* Route line (day picker) */
.route{overflow-x:auto;padding:4px 2px 14px;margin:0 -2px}
.route ol{list-style:none;margin:0;padding:0;display:flex;min-width:max-content;position:relative}
.route ol::before{content:"";position:absolute;left:22px;right:22px;top:21px;height:6px;border-radius:3px;background:var(--niyodo)}
.route li{position:relative;width:74px;text-align:center}
.route button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;border-radius:10px;padding:2px 0}
.route .stop{width:34px;height:34px;border-radius:50%;background:var(--card);border:4px solid var(--niyodo);
  display:grid;place-items:center;font-weight:900;font-size:.95rem;color:var(--ink);position:relative;z-index:1;margin-top:7px}
.route .town{font-size:.74rem;color:var(--muted);line-height:1.2;max-width:70px}
.route .dow{font-size:.7rem;color:var(--muted)}
.route button[aria-current="true"] .stop{background:var(--ai);border-color:var(--ai);color:var(--paper);transform:scale(1.15)}
.route button[aria-current="true"] .town{color:var(--ink);font-weight:700}
.route .today-dot{position:absolute;top:-4px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--yuzu);z-index:2}

/* Day header */
.dayhead{margin:6px 0 16px}
.dayhead h2{font-size:1.45rem;font-weight:900;margin:0 0 4px;line-height:1.2}
.dayhead .path{color:var(--muted);margin:0 0 10px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.88rem}
.fact b{font-weight:700}

/* Timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:62px 1fr;gap:12px;position:relative}
.tl .time{font-weight:700;font-size:.9rem;text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.tl .time span{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tl .body{border-left:3px solid var(--line);padding:10px 0 14px 16px;position:relative}
.tl .body::before{content:"";position:absolute;left:-9px;top:15px;width:15px;height:15px;border-radius:50%;background:var(--card);border:3px solid var(--ai)}
.tl li.drive .body{border-left:3px dashed var(--drive)}
.tl li.drive .body::before{border-color:var(--drive);width:11px;height:11px;left:-7px;top:17px}
.tl li.drive .title{color:var(--muted);font-weight:500}
.tl li.eat .body::before{border-color:var(--yuzu)}
.tl li.done .title{text-decoration:line-through;opacity:.6}
.title{font-weight:700;margin:0 0 2px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--niyodo-soft);color:var(--ai)}
.tag.opt{background:var(--yuzu-soft);color:var(--yuzu)}
.detail{color:var(--muted);font-size:.93rem;margin:2px 0 0}
.flag{margin-top:8px;background:var(--yuzu-soft);border-radius:10px;padding:8px 10px;font-size:.88rem;color:var(--ink)}
.flag::before{content:"Heads-up: ";font-weight:700;color:var(--yuzu)}
.tick{margin-top:6px;font:inherit;font-size:.8rem;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:3px 9px;cursor:pointer}
.stay{margin-top:18px;background:var(--ai);color:var(--paper);border-radius:14px;padding:14px 16px}
.stay h3{margin:0 0 2px;font-size:1rem}
.stay p{margin:0;opacity:.9;font-size:.92rem}
.addr{margin:8px 0 0;font-weight:500}
.addrbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.addrbtns .copy{text-decoration:none;display:inline-block}
.stay .addr{color:var(--paper)}
.stay .copy{color:var(--paper);border-color:rgba(255,255,255,.45)}
.verify{margin:6px 0 0;font-size:.82rem;opacity:.85;font-style:italic}
.wx{margin-top:12px;background:var(--niyodo-soft);border-radius:14px;padding:12px 14px}
.wx.wet{background:var(--yuzu-soft)}
.wxmain{display:flex;gap:12px;align-items:center}
.wxi{font-size:1.9rem;line-height:1}
.wxs{display:block;color:var(--muted);font-size:.86rem}
.wxn{margin:8px 0 0;font-size:.9rem}
.wxsrc{margin:6px 0 0;font-size:.76rem;color:var(--muted)}
.wxsrc a{color:var(--ai)}
.picks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.picks li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.88rem}
.prow{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.prow a{color:var(--ai);font-weight:700;text-decoration:none}
.hrs{font-size:.78rem;font-weight:700;background:var(--niyodo-soft);color:var(--ai);border-radius:6px;padding:1px 7px;white-space:nowrap}
.hrs.shut{background:var(--yuzu-soft);color:var(--yuzu)}
.stag{font-size:.7rem;font-weight:700;background:var(--yuzu-soft);color:var(--yuzu);border-radius:5px;padding:1px 6px;margin-right:6px}
.pnote{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.food{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--card)}
.food h3{margin:0 0 6px;font-size:1rem}
.food ul{margin:0;padding-left:18px;font-size:.92rem}
.food a{color:var(--ai)}

/* Generic sections */
section[hidden]{display:none}
h2.sec{font-size:1.3rem;font-weight:900;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.card p{margin:2px 0;font-size:.93rem}
.card .meta{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--niyodo-soft);color:var(--ai);white-space:nowrap}
.pill.warn{background:var(--yuzu-soft);color:var(--yuzu)}
.big{font-size:1.5rem;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.copy{font:inherit;font-size:.82rem;border:1px solid var(--line);background:none;color:var(--ai);border-radius:8px;padding:3px 10px;cursor:pointer}

/* Checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--ai);margin-top:2px;flex:none}
.check label{flex:1;cursor:pointer}
.check .who{color:var(--muted);font-size:.84rem;display:block}
.check.checked label{opacity:.55;text-decoration:line-through}
.check .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow input,.addrow select{flex:1 1 140px;font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;background:var(--ai);color:var(--paper);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}

/* Money */
table{width:100%;border-collapse:collapse;font-size:.92rem}
.tablewrap{overflow-x:auto}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.82rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.bal div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bal b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--yuzu)}
.note{color:var(--muted);font-size:.86rem}
.names{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.names input{width:110px;font:inherit;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}

@media (prefers-reduced-motion:no-preference){
  .route .stop{transition:transform .2s ease,background .2s ease}
}
@media (max-width:420px){
  .tl li{grid-template-columns:52px 1fr;gap:8px}
  .tl .body{padding-left:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Shikoku road trip<small>2–11 October 2026 · Kansai loop, 10 days</small></h1>
    <div class="countdown" id="countdown"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="days">Days</button>

    <button role="tab" aria-selected="false" data-tab="money">Money</button>
    <button role="tab" aria-selected="false" data-tab="pack">Pack</button>
    <button role="tab" aria-selected="false" data-tab="shop">Shop</button>

    <button role="tab" aria-selected="false" data-tab="heads">Heads-up</button>

  <section id="tab-heads" hidden></section>
</div>

 {d:6, dow:"Tue", town:"Ozu", title:"Niyodo Blue and Uchiko",

   ["09:15","09:45","Nikobuchi pool","see","Steep metal ladders and ropes down the ravine. Wear proper shoes."],

   ["12:30","13:00","Blue Brews taproom","opt","Craft beer brewed with Niyodo spring water.","Google Maps lists Blue Brew as closed on Tuesdays. Use this slot for lunch at CAFE and BEEF karu instead (open until 14:00)."],

/* ---------- Storage (per device) ---------- */
const KEY="shikoku26:";
function load(k,def){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function weatherBlock(d){
  const w=WEATHER[d]; if(!w) return "";
  return `<div class="wx${w.r>=70?" wet":""}"><div class="wxmain"><span class="wxi" aria-hidden="true">${w.i}</span>
    <div><b>${esc(w.c)}</b><span class="wxs">${w.hi}° / ${w.lo}° · ${w.r}% rain · ${esc(w.w)}</span></div></div>
    ${w.n?`<p class="wxn">${esc(w.n)}</p>`:""}
    <p class="wxsrc">tenki.jp forecast, issued 30 Sep 15:00 JST. <a href="https://tenki.jp/week/8/" target="_blank" rel="noopener">Check latest</a></p></div>`;
}
function picksBlock(d,t){
  const ps=[...(MEALS[d+"|"+t]||[]),...(SHOPS[d+"|"+t]||[])]; if(!ps.length) return "";
  return `<ul class="picks">${ps.map(p=>{
    const shut=/closed|not found/i.test(p.h);
    const url=p.id?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n)}&query_place_id=${p.id}`:"";
    return `<li><div class="prow"><span>${p.tag?`<span class="stag">${esc(p.tag)}</span>`:""}${url?`<a href="${url}" target="_blank" rel="noopener">${esc(p.n)}</a>`:`<b>${esc(p.n)}</b>`}</span><span class="hrs${shut?" shut":""}">${esc(p.h)}</span></div>${p.note?`<span class="pnote">${esc(p.note)}</span>`:""}</li>`}).join("")}</ul>`;
}
function mapUrl(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a)}
function addrBlock(s){
  if(!s.addr) return `<p class="addr">${esc(s.verify)}</p>`;
  return `<p class="addr">${esc(s.addr)}</p>
    <div class="addrbtns"><a class="copy" href="${mapUrl(s.addr)}" target="_blank" rel="noopener">Open in Maps</a>
    <button class="copy cp" data-t="${esc(s.addr)}">Copy address</button>
    ${s.tel?`<a class="copy" href="tel:${s.tel.replace(/\s/g,"")}">Call ${esc(s.tel)}</a>`:""}</div>
    ${s.verify?`<p class="verify">${esc(s.verify)}</p>`:""}`;
}
function wireCopy(root){root.querySelectorAll(".cp").forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.t).then(()=>{b.textContent="Copied"},()=>{})})}
function jstNow(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+9*3600000)}

/* ---------- Countdown ---------- */
(function(){
  const now=jstNow(); const start=new Date(2026,9,2); const end=new Date(2026,9,11);
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((start-today)/86400000);
  let t;
  if(diff>1) t=diff+" days to go";
  else if(diff===1) t="Fly tomorrow";
  else if(today<=end) t="Day "+(Math.round((today-start)/86400000)+1)+" of 10";
  else t="Trip complete";
  $("#countdown").textContent=t;
})();

let done=load("done",{});
function currentDayIndex(){
  const n=jstNow();
  if(n.getFullYear()===2026&&n.getMonth()===9){const i=DAYS.findIndex(x=>x.d===n.getDate());if(i>=0)return i}
  return -1;
}
const todayIdx=currentDayIndex();
let sel=todayIdx>=0?todayIdx:0;

function renderRoute(){
  $("#routeList").innerHTML=DAYS.map((x,i)=>`<li><button aria-current="${i===sel}" data-i="${i}" aria-label="${x.dow} ${x.d} October, ${x.town}">

  document.querySelectorAll("#routeList button").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;renderRoute();renderDay()});

function renderDay(){
  const x=DAYS[sel]; const s=x.stay?STAYS[x.stay]:null;
  const kinds={see:"",opt:'<span class="tag opt">Optional</span>',eat:'<span class="tag">Food</span>',do:'<span class="tag">Logistics</span>',drive:""};
  const items=x.items.map((it,j)=>{
    const [a,b,title,kind,detail,flag]=it; const id=x.d+"-"+j; const isDone=!!done[id];
    const cls=(kind==="drive"?"drive":kind==="eat"?"eat":"")+(isDone?" done":"");
    return `<li class="${cls}"><div class="time">${a}${b?`<span>${b}</span>`:""}</div>

      ${kind!=="drive"?`<button class="tick" data-id="${id}">${isDone?"Undo":"Mark done"}</button>`:""}</div></li>`;
  }).join("");
  const food=x.food.length?`<div class="food"><h3>Food picks from your notes</h3><ul>${x.food.map(f=>`<li><a href="${f[1]}" target="_blank" rel="noopener">${esc(f[0])}</a></li>`).join("")}</ul></div>`:"";
  $("#dayView").innerHTML=`<div class="dayhead"><h2>${x.dow} ${x.d} Oct · ${esc(x.title)}</h2>
    <p class="path">${esc(x.path)}</p>
    <div class="facts"><span class="fact"><b>${x.km}</b> driving</span><span class="fact"><b>${x.drive}</b> behind the wheel</span></div>${weatherBlock(x.d)}</div>
    <ol class="tl">${items}</ol>
    ${s?`<div class="stay"><h3>Tonight: ${esc(s.name)}</h3><p>${esc(s.place)} · ${esc(s.style)}</p>${addrBlock(s)}</div>`:`<div class="stay"><h3>Tonight: in the air</h3><p>KIX 18:25 → home 00:05</p></div>`}
    ${food}`;
  wireCopy($("#dayView"));
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{const id=b.dataset.id;done[id]=!done[id];save("done",done);renderDay()});
}

let people=load("people",["Jem","Ben","Cheese","Me"]);
let exps=load("exps",DEFAULT_EXP);
function renderMoney(){
  const total=exps.reduce((a,e)=>a+(+e.sgd||0),0); const share=total/people.length;
  const paid={}; people.forEach(p=>paid[p]=0); exps.forEach(e=>{if(paid[e.who]!==undefined)paid[e.who]+=+e.sgd||0});
  const bal=people.map(p=>({p,v:paid[p]-share}));
  // settle up
  const cred=bal.filter(b=>b.v>0.005).map(b=>({...b})).sort((a,b)=>b.v-a.v);
  const debt=bal.filter(b=>b.v<-0.005).map(b=>({p:b.p,v:-b.v})).sort((a,b)=>b.v-a.v);
  const moves=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){const m=Math.min(debt[i].v,cred[j].v);moves.push(`${esc(debt[i].p)} pays ${esc(cred[j].p)} <b>S$${m.toFixed(2)}</b>`);debt[i].v-=m;cred[j].v-=m;if(debt[i].v<0.005)i++;if(cred[j].v<0.005)j++}
  $("#tab-money").innerHTML=`<h2 class="sec">Who's paid what</h2>
  <p class="note">Rename the group here (the 4th slot is you):</p>
  <div class="names">${people.map((p,k)=>`<input aria-label="Person ${k+1}" value="${esc(p)}" data-k="${k}">`).join("")}</div>
  <div class="tablewrap"><table><thead><tr><th>Item</th><th>Paid by</th><th class="num">S$</th><th></th></tr></thead><tbody>
  ${exps.map((e,k)=>`<tr><td>${esc(e.what)}</td><td>${esc(e.who)}</td><td class="num">${(+e.sgd).toFixed(2)}</td><td><button class="del copy" data-k="${k}" aria-label="Remove ${esc(e.what)}">✕</button></td></tr>`).join("")}
  <tr><td><b>Total</b></td><td></td><td class="num"><b>${total.toFixed(2)}</b></td><td></td></tr></tbody></table></div>
  <div class="addrow"><input id="exWhat" placeholder="What was it?"><select id="exWho">${people.map(p=>`<option>${esc(p)}</option>`).join("")}</select>
    <input id="exAmt" type="number" step="0.01" inputmode="decimal" placeholder="S$"><button class="btn" id="exAdd">Add expense</button></div>
  <h2 class="sec" style="margin-top:22px">Balances</h2>
  <p class="note">Split evenly four ways: S$${share.toFixed(2)} each.</p>
  <div class="bal">${bal.map(b=>`<div>${esc(b.p)}<b class="${b.v>=0?"pos":"neg"}">${b.v>=0?"+":"−"}S$${Math.abs(b.v).toFixed(2)}</b></div>`).join("")}</div>
  <div class="card"><h3>To settle up</h3>${moves.length?moves.map(m=>`<p>${m}</p>`).join(""):"<p>All square.</p>"}</div>
  <p class="note">Kochi and Matsuyama are still at 3-room prices. Update those rows once Cheese tops up. <button class="copy" id="resetExp">Reset to original list</button></p>`;
  document.querySelectorAll(".names input").forEach(inp=>inp.onchange=()=>{
    const k=+inp.dataset.k,old=people[k],nv=inp.value.trim()||old; people[k]=nv;
    exps.forEach(e=>{if(e.who===old)e.who=nv}); save("people",people); save("exps",exps); renderMoney()});
  document.querySelectorAll("#tab-money .del").forEach(b=>b.onclick=()=>{exps.splice(+b.dataset.k,1);save("exps",exps);renderMoney()});
  $("#exAdd").onclick=()=>{const w=$("#exWhat").value.trim(),a=parseFloat($("#exAmt").value);if(!w||!(a>0))return;
    exps.push({what:w,who:$("#exWho").value,sgd:a});save("exps",exps);renderMoney()};
  $("#resetExp").onclick=()=>{exps=JSON.parse(JSON.stringify(DEFAULT_EXP));save("exps",exps);renderMoney()};
}

let packState=load("pack",{}); let packCustom=load("packCustom",[]);
function renderPack(){
  const all=PACK_DEFAULT.map(g=>[g[0],g[1].map(i=>({t:i[0],n:i[1]}))]);
  if(packCustom.length) all.push(["Added by you",packCustom.map((c,k)=>({t:c,n:"",k}))]);
  const total=all.reduce((a,g)=>a+g[1].length,0), done=all.reduce((a,g)=>a+g[1].filter(i=>packState[i.t]).length,0);
  $("#tab-pack").innerHTML=`<h2 class="sec">Packing list</h2><p class="note">${done} of ${total} packed. Ticks are saved on this device.</p>`+
   all.map(g=>`<div class="card"><h3>${esc(g[0])}</h3>${g[1].map(i=>{const id="pk"+btoa(unescape(encodeURIComponent(i.t))).replace(/[^a-z0-9]/gi,"");
     return `<div class="check ${packState[i.t]?"checked":""}"><input type="checkbox" id="${id}" data-t="${esc(i.t)}" ${packState[i.t]?"checked":""}>
     <label for="${id}">${esc(i.t)}${i.n?`<span class="who">${esc(i.n)}</span>`:""}</label>${i.k!==undefined?`<button class="del pdel" data-k="${i.k}" aria-label="Remove">×</button>`:""}</div>`}).join("")}</div>`).join("")+
   `<div class="addrow"><input id="pkNew" placeholder="Add an item"><button class="btn" id="pkAdd">Add</button><button class="btn ghost" id="pkReset">Untick all</button></div>`;
  document.querySelectorAll("#tab-pack input[type=checkbox]").forEach(c=>c.onchange=()=>{packState[c.dataset.t]=c.checked;save("pack",packState);renderPack()});
  document.querySelectorAll("#tab-pack .pdel").forEach(b=>b.onclick=()=>{packCustom.splice(+b.dataset.k,1);save("packCustom",packCustom);renderPack()});
  $("#pkAdd").onclick=()=>{const v=$("#pkNew").value.trim();if(!v)return;packCustom.push(v);save("packCustom",packCustom);renderPack()};
  $("#pkReset").onclick=()=>{packState={};save("pack",packState);renderPack()};
}
