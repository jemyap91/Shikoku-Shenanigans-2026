<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shikoku road trip · Oct 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Shikoku road trip<small>2–11 October 2026 · Kansai loop, 10 days</small></h1>
    <div class="countdown" id="countdown"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="days">Days</button>
    <button role="tab" aria-selected="false" data-tab="bookings">Bookings</button>
    <button role="tab" aria-selected="false" data-tab="money">Money</button>
    <button role="tab" aria-selected="false" data-tab="pack">Pack</button>
    <button role="tab" aria-selected="false" data-tab="shop">Shop</button>
    <button role="tab" aria-selected="false" data-tab="todo">To-do</button>
    <button role="tab" aria-selected="false" data-tab="heads">Heads-up</button>
  </nav>

  <section id="tab-days">
    <div class="route"><ol id="routeList"></ol></div>
    <div id="dayView"></div>
  </section>

  <section id="tab-bookings" hidden></section>
  <section id="tab-money" hidden></section>
  <section id="tab-pack" hidden></section>
  <section id="tab-shop" hidden></section>
  <section id="tab-todo" hidden></section>
  <section id="tab-heads" hidden></section>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
